<!DOCTYPE html>
<html>
<head>
    <title>Quiz Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="quiz-container">
    <h1>Admin Panel</h1>

    <h2>Add Question</h2>

    <input id="question" placeholder="Question"><br><br>
    <input id="option1" placeholder="Option 1"><br><br>
    <input id="option2" placeholder="Option 2"><br><br>
    <input id="option3" placeholder="Option 3"><br><br>
    <input id="option4" placeholder="Option 4"><br><br>
    <input id="answer" placeholder="Correct Answer"><br><br>

    <button onclick="addQuestion()">Add Question</button>

    <h2>Existing Questions</h2>

    <div id="questions"></div>
</div>

<script>
async function loadQuestions() {
    const response = await fetch("http://localhost:5000/api/questions");
    const questions = await response.json();

    const container = document.getElementById("questions");
    container.innerHTML = "";

    questions.forEach(q => {
        container.innerHTML += `
            <div class="question">
                <p><b>${q.id}. ${q.question}</b></p>
                <button onclick="deleteQuestion(${q.id})">Delete</button>
            </div>
        `;
    });
}

async function addQuestion() {
    const data = {
        question: document.getElementById("question").value,
        option1: document.getElementById("option1").value,
        option2: document.getElementById("option2").value,
        option3: document.getElementById("option3").value,
        option4: document.getElementById("option4").value,
        answer: document.getElementById("answer").value
    };

    const response = await fetch("http://localhost:5000/api/questions", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    });

    const result = await response.json();

    alert(result.message || result.error);

    if (response.ok) {
        document.querySelectorAll("input").forEach(input => {
            input.value = "";
        });

        loadQuestions();
    }
}

async function deleteQuestion(id) {
    if (!confirm("Delete this question?")) {
        return;
    }

    const response = await fetch(
        `http://localhost:5000/api/questions/${id}`,
        {
            method: "DELETE"
        }
    );

    const result = await response.json();

    alert(result.message || result.error);

    loadQuestions();
}

loadQuestions();
</script>

</body>
</html>
